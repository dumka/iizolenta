name: Tests

on:
  push:
    branches: [main]
    paths:
      - "izolenta/**"
      - "tests/**"
      - "site/*.js"
      - "feeds.toml"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/tests.yml"
  workflow_dispatch:
  pull_request:
    paths:
      - "izolenta/**"
      - "tests/**"
      - "site/*.js"
      - "feeds.toml"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - run: uv sync --frozen
      - run: uv run pytest -q
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: node --test "tests/js/*.test.mjs"
