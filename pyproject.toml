[project]
name = "izolenta"
version = "0.1.0"
description = "AI/IT news dashboard that replaces procrastination sites"
requires-python = ">=3.12"
dependencies = [
    "feedparser>=6.0",
    "httpx>=0.27",
    "trafilatura>=2.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = false
