# Izolenta news sources and collector settings.
# default_category is a hint for the summarizer: ai | dev | business.

[settings]
max_items_per_run = 50
max_age_hours = 48
article_text_limit = 5000
http_timeout = 15
max_response_bytes = 5_000_000
seen_retention_days = 14
fetch_workers = 12
max_posts_per_run = 10
max_habr_per_run = 10
max_world_per_run = 25
world_text_limit = 1200
world_max_age_hours = 36
post_max_age_hours = 48
hn_discussions = true
hn_min_points = 200
hn_min_comments = 80
hn_max_age_hours = 36
max_discussions_per_run = 4
hn_top_comments = 12
user_agent = "Mozilla/5.0 (compatible; IzolentaBot/0.1; +https://github.com/dumka/iizolenta)"

[[feeds]]
name = "TechCrunch"
url = "https://techcrunch.com/category/artificial-intelligence/feed/"
default_category = "ai"

