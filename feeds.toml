# Izolenta news sources and collector settings.
# default_category is a hint for the summarizer: ai | dev | business.

[settings]
max_items_per_run = 15
max_age_hours = 48
article_text_limit = 8000
http_timeout = 15
max_response_bytes = 5_000_000
seen_retention_days = 14
fetch_workers = 8
user_agent = "Mozilla/5.0 (compatible; IzolentaBot/0.1; +https://github.com/dumka/izolenta)"

[[feeds]]
name = "TechCrunch"
url = "https://techcrunch.com/category/artificial-intelligence/feed/"
default_category = "ai"

[[feeds]]
name = "TechCrunch Startups"
url = "https://techcrunch.com/category/startups/feed/"
default_category = "business"

